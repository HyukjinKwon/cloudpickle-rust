name: Publish cloudpickle-rust 🥒🦀 distribution 📦 to PyPI
# Build the wheels of all the supported platforms and Python versions with
# maturin, and publish them to PyPI using trusted publishing:
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The free-threaded interpreters are not selected by --find-interpreter
  # (which honors requires-python, excluding the CPython versions not supported
  # by PyO3 0.28, and the versions of PyPy supported by PyO3). maturin only
  # builds free-threaded wheels for Python 3.14 and later: on 3.13t (where
  # free-threading is experimental), cloudpickle-rust is built from source.
  FREE_THREADED_INTERPRETERS: python3.14t

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.FREE_THREADED_INTERPRETERS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.FREE_THREADED_INTERPRETERS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_versions: |
              3.8
              3.9
              3.10
              3.11
              3.12
              3.13
              3.14
            free_threaded: true
          - runner: windows-latest
            target: x86
            python_arch: x86
            python_versions: |
              3.8
              3.9
              3.10
              3.11
              3.12
              3.13
              3.14
            free_threaded: false
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            python_versions: |
              3.11
              3.12
              3.13
              3.14
            free_threaded: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python_versions }}
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # requires-python (< 3.15) restricts the interpreters found to the
          # versions supported by PyO3 0.28.
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Set up free-threaded Python 3.14
        if: ${{ matrix.platform.free_threaded }}
        id: python314t
        uses: actions/setup-python@v6
        with:
          python-version: 3.14t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        if: ${{ matrix.platform.free_threaded }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ steps.python314t.outputs.python-path }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install the Python interpreters
        id: interpreters
        shell: bash
        # setup-python does not provide all the versions (e.g. CPython 3.8)
        # on arm64 macOS runners: use uv's builds for all of them instead.
        run: |
          versions="3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.14t pypy3.11"
          uv python install $versions
          paths=""
          for version in $versions; do
            paths="$paths $(uv python find $version)"
          done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ steps.interpreters.outputs.paths }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  test-wheels:
    name: Test the wheels (${{ matrix.os }}, Python ${{ matrix.python_version }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python_version: ["3.8", "3.14", "3.14t"]
        exclude:
          - os: macos-latest
            python_version: "3.8"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Install the wheel and the test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --no-index --find-links dist cloudpickle-rust
          python -m pip install -r dev-requirements.txt
      - name: Run the test-suite against the installed wheel
        shell: bash
        run: |
          PYTHONPATH='.:tests' python -m pytest -r s -vs

  publish-to-pypi:
    name: >-
      Publish cloudpickle-rust 🥒🦀 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs: [linux, musllinux, windows, macos, sdist, test-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloudpickle-rust
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      attestations: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
