[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "cloudpickle-rust"
description = "Extended pickling support for Python objects: a Rust implementation of cloudpickle"
authors = [
    { name = "The cloudpickle-rust developer team" },
]
readme = "README.md"
requires-python = ">=3.8,<3.16"
license = "Apache-2.0"
# The code derived from cloudpickle keeps its BSD 3-Clause notice.
license-files = ["LICENSE", "NOTICE", "licenses/*"]
dynamic = ["version"]
keywords = ["pickle", "serialization", "cloudpickle", "distributed computing", "rust"]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Operating System :: POSIX',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS :: MacOS X',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading :: 2 - Beta',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Programming Language :: Rust',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Distributed Computing',
]

[project.urls]
Homepage = "https://github.com/HyukjinKwon/cloudpickle-rust"
Repository = "https://github.com/HyukjinKwon/cloudpickle-rust"
Issues = "https://github.com/HyukjinKwon/cloudpickle-rust/issues"
Changelog = "https://github.com/HyukjinKwon/cloudpickle-rust/blob/main/CHANGES.md"
Upstream = "https://github.com/cloudpipe/cloudpickle"

[tool.maturin]
# The Rust extension module *is* the `cloudpickle_rust.cloudpickle` module,
# mirroring the `cloudpickle/cloudpickle.py` module of upstream cloudpickle.
module-name = "cloudpickle_rust.cloudpickle"
python-source = "python"
strip = true
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "licenses/*", format = "sdist" },
    { path = "CHANGES.md", format = "sdist" },
    { path = "dev-requirements.txt", format = "sdist" },
    { path = "tox.ini", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "benchmarks/**/*", format = "sdist" },
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    # Artifacts of `pip install ./tests/cloudpickle_testpkg`
    { path = "tests/cloudpickle_testpkg/build/**", format = "sdist" },
    { path = "tests/**/*.egg-info/**", format = "sdist" },
]

[tool.black]
line-length = 88
target_version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
preview = true

[tool.ruff]
line-length = 88
target-version = "py38"
